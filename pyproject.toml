[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pep2md"
version = "0.1.0"
description = "Mirror Python PEPs to Markdown with metadata, indexing, and incremental sync."
readme = "README.md"
requires-python = ">=3.12.13"
dependencies = [
  "pypandoc_binary>=1.15",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
pep2md = "pep2md.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"
testpaths = ["tests"]
